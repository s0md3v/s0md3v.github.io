---
layout: default
title: Gallery
permalink: /gallery
description: Photographs by Somdev Sangwan.
---

<style>
    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .gallery {
        --gallery-gap: 15px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        grid-auto-rows: 10px;
        grid-auto-flow: dense;
        gap: var(--gallery-gap);
        padding: var(--gallery-gap);
        width: 100%;
        margin: 0;
        box-sizing: border-box;
    }

    .gallery-item-wrapper {
        width: 100%;
        height: 100%;
    }

    .gallery-item {
        width: 100%;
        height: 100%;
        /* Reset native <button> styles */
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        font: inherit;
        color: inherit;
        text-align: inherit;
        -webkit-appearance: none;
        appearance: none;
        background: var(--code-bg);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        /* Keeps shimmer/img z-index below the fixed header and mobile nav */
        isolation: isolate;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg,
                transparent 0%,
                color-mix(in srgb, var(--background-color) 40%, transparent) 50%,
                transparent 100%);
        transform: translateX(-100%);
        animation: shimmer 1.5s infinite;
        z-index: 1;
        /* Above background, below image */
    }

    .gallery-item.img-loaded::before {
        display: none;
    }

    @keyframes shimmer {
        100% {
            transform: translateX(100%);
        }
    }

    .gallery-item:focus-visible {
        outline: 3px solid var(--accent-color);
        outline-offset: 2px;
    }

    .gallery-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        z-index: 1;
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease, opacity 0.5s ease;
        opacity: 0;
        position: relative;
        z-index: 2;
        /* Above skeleton shimmer */
    }

    .gallery-item.img-loaded img {
        opacity: 1;
    }

    .gallery-item:hover img {
        transform: scale(1.05);
    }

    .gallery-item-wrapper.wide {
        grid-column: span 2;
    }

    @media (max-width: 600px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
            /* row_span assumes row + gap = column / 12 (300px / 25px); column = (100vw - 24px) / 2 */
            grid-auto-rows: calc((100vw - 24px) / 24 - 8px);
            gap: 8px;
            padding: 8px;
        }
    }

    .modal {
        display: none;
        outline: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.95);
        z-index: 2000;
        padding: 20px;
        box-sizing: border-box;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .modal.visible {
        opacity: 1;
    }

    /* The photo in the camera's bezel, its pink where it frames the screen, and as
       narrow, so it doesn't tint the photo */
    .modal-screen {
        position: relative;
        max-width: 95%;
        transform: scale(0.95);
        transition: transform 0.3s ease;
    }

    .modal.visible .modal-screen {
        transform: scale(1);
    }

    .modal img {
        display: block;
        max-width: 100%;
        max-height: calc(95vh - 2 * var(--bezel));
        --bezel: clamp(6px, 1.1vmin, 11px);
        border: var(--bezel) solid rgb(172 122 130);
        border-radius: calc(var(--bezel) * 0.8);
        box-sizing: content-box;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
        object-fit: contain;
    }

    /* Which one it is, as the camera says it */
    .modal-count {
        position: absolute;
        top: calc(clamp(6px, 1.1vmin, 11px) + 0.9em);
        right: calc(clamp(6px, 1.1vmin, 11px) + 1.1em);
        font: 600 clamp(12px, 1.7vmin, 17px)/1 system-ui, sans-serif;
        letter-spacing: 0.03em;
        color: #fff;
        text-shadow: 0 0 0.25em rgba(0, 0, 0, 0.8);
        pointer-events: none;
    }

    .close-button {
        position: fixed;
        top: 20px;
        right: 20px;
        color: white;
        font-size: 3rem;
        line-height: 1;
        cursor: pointer;
        background: none;
        border: none;
        padding: 10px;
        z-index: 2001;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        transition: color 0.2s ease;
    }

    .close-button:hover {
        color: var(--accent-color);
    }
</style>

<h1 class="sr-only">Gallery</h1>

<div class="gallery" id="gallery">
    {% for image in site.data.gallery %}
    {% assign stem = image.filename | remove: '.webp' %}
    {% assign thumb = site.baseurl | append: '/assets/photos/thumbs/' | append: stem %}
    <div class="gallery-item-wrapper {% if image.is_wide %}wide{% endif %}"
        style="grid-row-end: span {{ image.row_span }};">
        <button type="button" class="gallery-item" data-full="{{ site.baseurl }}{{ image.path }}"
            aria-label="View photo {{ image.filename }}">
            <img src="{{ thumb }}-400.webp"
                srcset="{{ thumb }}-400.webp 400w, {{ thumb }}-800.webp 800w, {{ site.baseurl }}{{ image.path }} {{ image.width }}w"
                sizes="{% if image.is_wide %}(max-width: 600px) 100vw, 600px{% else %}(max-width: 600px) 50vw, 300px{% endif %}"
                width="{{ image.width }}" height="{{ image.height }}"
                {% if forloop.index <= 6 %}loading="eager"{% if forloop.first %} fetchpriority="high"{% endif %}{% else %}loading="lazy"{% endif %}
                alt="Photo {{ image.filename }}"
                onload="this.parentElement.classList.add('img-loaded')"
                onerror="if(!this.dataset.fallback){this.dataset.fallback=1;this.removeAttribute('srcset');this.src=this.parentElement.dataset.full}">
        </button>
    </div>
    {% endfor %}
</div>

<div class="modal" id="modal" tabindex="-1" style="display: none;" role="dialog" aria-modal="true" aria-label="Image view">
    <button type="button" class="close-button" aria-label="Close image view">&times;</button>
    <span class="modal-screen">
        <img id="modal-img" src="" alt="">
        <span class="modal-count" aria-hidden="true"></span>
    </span>
</div>

<script>
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const closeBtn = modal.querySelector('.close-button');
    let opener = null;
    let inerted = [];
    let closeTimer = null;

    // Make everything outside the dialog inert while it is open
    function setBackgroundInert(on) {
        if (on) {
            inerted = [];
            for (let el = modal; el && el !== document.body; el = el.parentElement) {
                for (const sib of el.parentElement.children) {
                    if (sib !== el && !sib.inert && !['SCRIPT', 'STYLE'].includes(sib.tagName)) {
                        sib.inert = true;
                        inerted.push(sib);
                    }
                }
            }
        } else {
            inerted.forEach(el => { el.inert = false; });
            inerted = [];
        }
    }

    function isOpen() {
        return modal.classList.contains('visible');
    }

    function openModal(imgSrc, trigger, quiet) {
        clearTimeout(closeTimer);
        opener = trigger || document.activeElement;
        modal.style.display = 'flex';
        // Force reflow so the transition runs
        void modal.offsetWidth;
        modal.classList.add('visible');

        modalImg.src = imgSrc;
        const thumb = trigger && trigger.querySelector('img');
        modalImg.alt = thumb ? thumb.alt : '';
        const items = Array.from(document.querySelectorAll('.gallery-item'));
        modal.querySelector('.modal-count').textContent =
            items.includes(trigger) ? `${items.indexOf(trigger) + 1}/${items.length}` : '';
        document.body.style.overflow = 'hidden';
        setBackgroundInert(true);
        // Opened from a link, with nothing pressed yet, the close button would show as
        // focused from the keyboard: the dialog takes focus instead
        (quiet ? modal : closeBtn).focus();
    }

    function closeModal() {
        if (!isOpen()) return;
        modal.classList.remove('visible');
        setBackgroundInert(false);
        document.body.style.overflow = '';
        if (opener && document.contains(opener)) {
            opener.focus({ preventScroll: true });
        }
        opener = null;
        closeTimer = setTimeout(() => {
            modal.style.display = 'none';
            modalImg.src = '';
        }, 300);
    }

    document.getElementById('gallery').addEventListener('click', (e) => {
        const item = e.target.closest('.gallery-item');
        if (item) openModal(item.dataset.full, item);
    });

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            closeModal();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (!isOpen()) return;
        if (e.key === 'Escape') {
            closeModal();
        } else if (e.key === 'Tab') {
            // The close button is the dialog's only control: keep focus on it
            e.preventDefault();
            closeBtn.focus();
        }
    });

    // From the homepage's camera: #7 opens the seventh photo, from where it is
    {
        const linked = /^#(\d+)$/.exec(location.hash);
        const item = linked && document.querySelectorAll('.gallery-item')[linked[1] - 1];
        if (linked) history.replaceState(null, '', location.pathname + location.search);
        if (item) {
            item.scrollIntoView({ block: 'center' });
            openModal(item.dataset.full, item, true);
        }
    }
</script>
