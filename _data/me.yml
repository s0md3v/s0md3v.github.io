# His shers, the text checked on Rekhta; `translation` is what each means, in English
- section: Poetry
  items:
    - text: maana ki is zameen ko na gulzaar kar sake<br>kuchh khaar kam to kar gaye guzre jidhar se hum
      translation: "Granted, we couldn't turn this earth into a garden, but wherever we passed, we left a few thorns fewer."
      sher: true
      by: Sahir Ludhianvi
    - text: le de ke apne paas faqat ek nazar to hai<br>kyun dekhen zindagi ko kisi ki nazar se hum
      translation: "All said and done, all I have is my own pair of eyes, so why would I see life through someone else's?"
      sher: true
      by: Sahir Ludhianvi
    - text: main lautne ke iraade se ja raha hoon magar<br>safar safar hai mera intezaar mat karna
      translation: "I'm leaving meaning to come back, but a journey is a journey, so don't wait for me."
      sher: true
      by: Sahil Sahri
    - text: na karen aap wafa hum ko kya<br>bewafa aap hi kahlaiyega
      translation: "If you won't be faithful, what's it to me? You're the one who'll be called unfaithful."
      sher: true
      by: Hasrat Mohani # Rekhta lists him; not confirmed elsewhere
    - text: be-dili kya yoonhi din guzar jayenge<br>sirf zinda rahe hum to mar jayenge
      translation: "Will the days just pass like this, heartless? If all we do is stay alive, we'll die."
      sher: true
      by: Jaun Elia
