# Everything on /taste. `opening` is any writing at the top and `closing` at the bottom (markdown);
# `sections` are the rest, in order. Most things in a section need only a title and a slug (its picture is
# assets/images/taste/<slug>-<width>.webp, made by _raw/taste_images.py). Everything else is optional:
#   meta: a little more, under the title (an author, "s1 only!")
#   note: what he'd say about it, written beside it in his pen. Each line of it is a line as he'd
#         write it (a note is never wrapped for him), so break it where he'd pause. Two things
#         side by side shouldn't both have notes, or they read as one line
#   mark: favourite | recommend, a sticker on it saying "fav" or "start here"
#   sticker: a sticker of his own, for what's worth knowing before you start ("s1 only!")
#   note_above: written above its picture, outside it, not beside it
#   url:  where it can be had, if it's something to read, watch or visit online
#   mm:   for a thing he uses or wears, how wide it is as it's pictured, so they're at their own sizes
#   foot: for a sneaker, where in its picture (0 to 1 across) a foot would sit in it, heel to toes:
#         inside the heel counter and the toe box, not the midsole bulging past them. They're all
#         his size, so it's the feet that are made the same length, and a chunky shoe looks it.
#         Judged by eye from the pictures

