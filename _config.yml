baseurl: ""
safe: false
# Settings previously forced/defaulted by the github-pages gem, kept so output doesn't change.
future: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
url: "https://somdev.in"
title: "Somdev Sangwan"
permalink: pretty

collections:
  blog:
    output: true
    permalink: /blog/:name
  essays:
    output: true
    permalink: /essays/:name

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile.jpg
  - scope:
      path: ""
      type: blog
    values:
      layout: post
      author: Somdev Sangwan
      type: tech
  - scope:
      path: ""
      type: essays
    values:
      layout: post
      author: Somdev Sangwan
      type: philosophy

description: "Somdev Sangwan is a security researcher & developer. He also writes about epistemology and ethics."
author:
  name: Somdev Sangwan
  twitter: s0md3v
  url: https://somdev.in
# Social handles
social:
  twitter: s0md3v
  github: s0md3v
  linkedin: s0md3v
  instagram: s0md3v

# Required for jekyll-seo-tag
twitter:
  username: s0md3v

plugins:
  - jekyll-seo-tag
  - jekyll-minifier
  - jekyll-redirect-from

redirect_from:
  json: false

jekyll-minifier:
  # Its CSS compressor mangles var() and env() inside calc() (e.g. "var( -  - blog - font - size)")
  compress_css: false
  exclude:
    - "playground/**/*"

sass:
  style: compressed

exclude:
  - "denoise*.html"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - mockups
  - scripts
  - keys.txt
  - .git
