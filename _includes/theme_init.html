<style>
    :root {
        --base-font-size: 1rem;
        --blog-font-size: 1rem;
        --base-font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
        --blog-font-family: var(--base-font-family);

        /* Inner pages are a sheet of paper on the homepage's table: --background-color is
           the sheet. --desk-color is the average of --desk-image (_raw/deskroom.py), so a
           page can't flash while the image is on its way.
           Body text ~14:1, muted text >5:1 (WCAG AA) */
        color-scheme: light;
        --desk-color: #e4e0d6;
        --desk-image: url('{{ "/assets/images/table/desk-day.avif" | relative_url }}');
        --sheet-shadow: 28, 34, 44;
        --background-color: #f6f3ea;
        --foreground-color: #26231f;
        --heading-color: #26231f;
        --midground-color: #5d564f;
        --accent-color: #1565c0;
        --on-accent-color: #fff;
        --link-hover-bg: #e9e4d7;
        --muted-color: #655e56;
        --border-color: #dcd6c6;
        --code-bg: #ebe6d8;
        --link-color: #0d47a1;
        --link-visited: #0d47a1;
    }

    /* Nothing's read on the table at night, so it's black, which sets the sheet apart. The
       sheet stays dark, though real paper wouldn't. Each kind of text has its own step, by
       APCA, as contrast ratios flatter light text on dark: headings Lc 89, body 76, quotes
       62, labels 49. */
    .dark-mode {
        color-scheme: dark;
        --desk-color: {% if page.layout_style == 'homepage' %}#232323{% else %}#000{% endif %};
        --desk-image: none;
        --sheet-shadow: 0, 0, 0;
        --background-color: #100f0f;
        --foreground-color: #cecdc3;
        --heading-color: #e6e2da;
        --midground-color: #b7b5ac;
        --accent-color: #42a5f5;
        --on-accent-color: #100f0f;
        --link-hover-bg: #34322e;
        --muted-color: #9f9d96;
        --border-color: #34322e;
        --code-bg: #292724;
        --link-color: #64b5f6;
        --link-visited: #a6d6ff;
    }

    * {
        font-feature-settings: "kern" 1, "liga" 1, "onum" 0;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-variant-numeric: normal;
    }

    html {
        background: var(--background-color);
        color: var(--foreground-color);
        font-size: 1rem;
        height: 100%;
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
        overflow-y: scroll;
        text-rendering: optimizeLegibility;
    }

    body {
        display: flex;
        flex-direction: column;
        height: 100%;
        font-family: var(--blog-font-family);
        font-size: var(--blog-font-size);
        line-height: 1.5;
        font-weight: 400;
    }

    a {
        background: none;
        color: var(--foreground-color);
        text-decoration: none;
    }

    a:hover {
        background-color: var(--link-hover-bg);
    }

    button,
    input,
    select,
    textarea {
        font: inherit;
    }

    /* Going from page to page, the table stays and a sheet's brought over it. Paper's opaque, so
       a sheet moves, whole, rather than fading through the one under it. Each page's sheet has
       its own name, so the old one doesn't turn into the new one. */
    @media (min-width: 769px) and (prefers-reduced-motion: no-preference) {
        @view-transition {
            navigation: auto;
        }

        .wrapper {
            view-transition-name: sheet-{{ page.url | slugify }};
            view-transition-class: sheet;
        }

        /* The default adds the two pages' light together, which can overshoot */
        ::view-transition-old(root) {
            animation: none;
            mix-blend-mode: normal;
        }

        ::view-transition-new(root) {
            animation: table-show 0.2s linear both;
            mix-blend-mode: normal;
        }

        {% if page.layout_style == 'homepage' %}
        ::view-transition-old(.sheet) {
            animation: sheet-away 0.32s cubic-bezier(0.5, 0, 0.8, 0.4) both;
        }
        {% else %}
        ::view-transition-new(.sheet) {
            animation: sheet-over 0.36s cubic-bezier(0.16, 0.84, 0.3, 1) both;
        }

        ::view-transition-old(.sheet) {
            animation: sheet-under 0.36s linear both;
        }
        {% endif %}

        @keyframes table-show {
            from {
                opacity: 0;
            }
        }

        @keyframes sheet-over {
            from {
                transform: translateY(100vh);
            }
        }

        @keyframes sheet-away {
            to {
                transform: translateY(100vh);
            }
        }

        /* Gone by the time it's covered. Only a wider sheet's edges would show it going. */
        @keyframes sheet-under {
            50% {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    }

    @media (prefers-reduced-motion: reduce) {
        html {
            scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
</style>

<script>
    const themes = ["light", "dark"];

    function getPreferredTheme() {
        let savedTheme = localStorage.getItem("theme");
        // The old cream theme became the light theme
        if (savedTheme === "cream") savedTheme = "light";
        if (savedTheme && themes.includes(savedTheme)) return savedTheme;

        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        return systemPrefersDark ? "dark" : "light";
    }

    function applyTheme(theme) {
        document.documentElement.classList.remove("light-mode", "dark-mode");
        document.documentElement.classList.add(`${theme}-mode`);
        // The browser's own bars take the colour of what's under them
        document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement)
            .getPropertyValue("{% if page.layout_style == 'homepage' %}--desk-color{% else %}--background-color{% endif %}");
        localStorage.setItem("theme", theme);
    }

    try {
        const currentTheme = getPreferredTheme();
        applyTheme(currentTheme);
    } catch (e) {
        console.error("Theme initialization failed:", e);
    }

    // Applied before first paint to avoid layout shift; also used by assets/js/common.js
    const DEFAULT_FONT = "serif";
    const DEFAULT_FONT_SIZE = 1.0;
    const FONT_FAMILIES = {
        serif: '"Source Serif 4", Georgia, "Times New Roman", serif',
        lexend: '"Lexend", sans-serif',
        opendyslexic: '"OpenDyslexic", sans-serif',
        system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
    };

    function getFontFamily(font) {
        return FONT_FAMILIES[font] || "var(--base-font-family)";
    }

    try {
        const root = document.documentElement;
        const savedFont = localStorage.getItem("font") || DEFAULT_FONT;
        root.style.setProperty("--blog-font-family", getFontFamily(savedFont));
        if (savedFont === "opendyslexic") {
            const preload = document.createElement("link");
            preload.rel = "preload";
            preload.as = "font";
            preload.type = "font/woff2";
            preload.crossOrigin = "anonymous";
            preload.href = "{{ '/assets/fonts/OpenDyslexic-Regular.woff2' | relative_url }}";
            document.head.appendChild(preload);
        }

        const savedSize = parseFloat(localStorage.getItem("fontSize"));
        root.style.setProperty("--blog-font-size", (savedSize > 0 ? savedSize : DEFAULT_FONT_SIZE) + "rem");
    } catch (e) {
        console.error("Font settings initialization failed:", e);
    }
</script>
