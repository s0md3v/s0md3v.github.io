<style>
    :root {
        --base-font-size: 1rem;
        --blog-font-size: 1rem;
        --base-font-family: "Lexend", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --blog-font-family: var(--base-font-family);

        /* Body text ~14:1, muted text >5:1 (WCAG AA) */
        color-scheme: light;
        --background-color: #f6f3ea;
        --foreground-color: #26231f;
        --midground-color: #5d564f;
        --accent-color: #1565c0;
        --link-hover-bg: #e9e4d7;
        --muted-color: #655e56;
        --border-color: #dcd6c6;
        --code-bg: #ebe6d8;
        --link-color: #0d47a1;
        --link-visited: #0d47a1;
        --icon-filter: none;
    }

    /* Off-black/off-white to avoid halation */
    .dark-mode {
        color-scheme: dark;
        --background-color: #1c1b19;
        --foreground-color: #e6e2da;
        --midground-color: #aaa49a;
        --accent-color: #42a5f5;
        --link-hover-bg: #34322e;
        --muted-color: #968f85;
        --border-color: #34322e;
        --code-bg: #292724;
        --link-color: #64b5f6;
        --link-visited: #a6d6ff;
        --icon-filter: invert(1);
    }

    * {
        font-feature-settings: "kern" 1, "liga" 1, "onum" 0;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-variant-numeric: normal;
    }

    html {
        background: var(--background-color);
        color: var(--foreground-color);
        font-size: 1rem;
        height: 100%;
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
        overflow-y: scroll;
        text-rendering: optimizeLegibility;
    }

    body {
        display: flex;
        flex-direction: column;
        height: 100%;
        font-family: var(--blog-font-family);
        font-size: var(--blog-font-size);
        line-height: 1.5;
        font-weight: 400;
    }

    a {
        background: none;
        color: var(--foreground-color);
        text-decoration: none;
    }

    a:hover {
        background-color: var(--link-hover-bg);
    }

    button,
    input,
    select,
    textarea {
        font: inherit;
    }

    @media (prefers-reduced-motion: reduce) {
        html {
            scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
</style>

<script>
    const themes = ["light", "dark"];

    function getPreferredTheme() {
        let savedTheme = localStorage.getItem("theme");
        // The old cream theme became the light theme
        if (savedTheme === "cream") savedTheme = "light";
        if (savedTheme && themes.includes(savedTheme)) return savedTheme;

        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        return systemPrefersDark ? "dark" : "light";
    }

    function applyTheme(theme) {
        document.documentElement.classList.remove("light-mode", "dark-mode");
        document.documentElement.classList.add(`${theme}-mode`);
        localStorage.setItem("theme", theme);
    }

    try {
        const currentTheme = getPreferredTheme();
        applyTheme(currentTheme);
    } catch (e) {
        console.error("Theme initialization failed:", e);
    }

    // Applied before first paint to avoid layout shift; also used by assets/js/common.js
    const DEFAULT_FONT = "lexend";
    const DEFAULT_FONT_SIZE = 1.0;
    const FONT_FAMILIES = {
        lexend: '"Lexend", sans-serif',
        opendyslexic: '"OpenDyslexic", sans-serif',
        system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
    };

    function getFontFamily(font) {
        return FONT_FAMILIES[font] || "var(--base-font-family)";
    }

    try {
        const root = document.documentElement;
        const savedFont = localStorage.getItem("font") || DEFAULT_FONT;
        root.style.setProperty("--blog-font-family", getFontFamily(savedFont));
        if (savedFont === "opendyslexic") {
            const preload = document.createElement("link");
            preload.rel = "preload";
            preload.as = "font";
            preload.type = "font/woff2";
            preload.crossOrigin = "anonymous";
            preload.href = "{{ '/assets/fonts/OpenDyslexic-Regular.woff2' | relative_url }}";
            document.head.appendChild(preload);
        }

        const savedSize = parseFloat(localStorage.getItem("fontSize"));
        root.style.setProperty("--blog-font-size", (savedSize > 0 ? savedSize : DEFAULT_FONT_SIZE) + "rem");
    } catch (e) {
        console.error("Font settings initialization failed:", e);
    }

    try {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
            if (!localStorage.getItem("theme")) {
                applyTheme(e.matches ? "dark" : "light");
            }
        });
    } catch (e) { }
</script>
